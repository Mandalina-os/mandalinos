<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandalina OS - Kod Adı: GLITCH</title>
    <style>
        :root {
            --bg-color: #0a0d12;
            --card-bg: #121824;
            --accent-orange: #ff6f00;
            --accent-glitch: #00f0ff;
            --text-color: #e6edf3;
            --border-color: #212836;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            width: 90%;
            max-width: 600px;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 30px rgba(0,240,255,0.05);
            text-align: center;
            position: relative;
        }
        .glitch-title {
            font-size: 32px;
            font-weight: 800;
            color: var(--accent-orange);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
            text-shadow: 0 0 10px rgba(255,111,0,0.5);
        }
        .codename {
            display: inline-block;
            background: rgba(0, 240, 255, 0.1);
            color: var(--accent-glitch);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            border: 1px solid var(--accent-glitch);
            margin-bottom: 20px;
        }
        .hero-desc {
            color: #8b949e;
            font-size: 15px;
            line-height: 1.6;
            margin-bottom: 30px;
        }
        .btn-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
        }
        .main-btn {
            background: #1a2233;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            padding: 16px 20px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            text-decoration: none;
        }
        .main-btn:hover {
            transform: translateY(-2px);
            border-color: var(--accent-orange);
            box-shadow: 0 5px 15px rgba(255, 111, 0, 0.2);
            color: #fff;
        }
        .btn-primary {
            background: linear-gradient(135deg, #ff6f00, #ff8f00);
            border: none;
            color: white;
        }
        .btn-primary:hover {
            box-shadow: 0 5px 20px rgba(255, 111, 0, 0.4);
        }
        .btn-support {
            border-color: var(--accent-glitch);
            color: var(--accent-glitch);
        }
        .btn-support:hover {
            background: var(--accent-glitch);
            color: #000;
            box-shadow: 0 5px 20px rgba(0, 240, 255, 0.4);
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="glitch-title">Mandalina OS</div>
        <div class="codename">KOD ADI: GLITCH</div>
        <p class="hero-desc">Hızlı, özelleştirilebilir ve hafif yeni nesil işletim sistemi deneyimi.</p>

        <div class="btn-grid">
            <a href="#" class="main-btn btn-primary" onclick="alert('Mandalina OS GLITCH ISO indirme bağlantısı hazırlanıyor...')">
                <span>⚡ Mandalina OS'u İndir (ISO)</span>
            </a>
            <a href="destek/" class="main-btn btn-support">
                <span>📞 Canlı Destek & Santral Hattı</span>
            </a>
        </div>
    </div>

</body>
</html>
