<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandalina OS - Destek Hattı</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #ff6f00;
            --accent-cyan: #00f0ff;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 480px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; padding: 24px;
            box-sizing: border-box; text-align: center;
        }
        h1 { color: var(--accent-color); margin-bottom: 8px; }
        .queue-card {
            background: #0d1117; border: 1px solid var(--accent-cyan); border-radius: 10px;
            padding: 15px; margin: 20px 0; display: none;
        }
        .pulse-btn {
            background: linear-gradient(135deg, #ff6f00, #ff8f00); color: white; border: none;
            padding: 16px; border-radius: 8px; font-weight: bold; width: 100%; cursor: pointer; margin-top: 10px;
        }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <h1>Mandalina OS Santral</h1>
        <p style="color:#8b949e;">Canlı İletişim & Destek Hattı</p>

        <div id="userInfoDisplay" style="color: var(--accent-cyan); font-weight: bold; margin-bottom: 15px;"></div>

        <button class="pulse-btn" onclick="destekTalebiOlustur()">📞 Maestro (Muhammed) ile Görüşme Sırası Al</button>

        <!-- Canlı Sıra Durum Kartı -->
        <div class="queue-card" id="queueCard">
            <h3 style="color: var(--accent-cyan); margin: 0 0 10px 0;">Sıra Bekleniyor...</h3>
            <p id="queuePositionText" style="font-size: 18px; font-weight: bold; color: #fff;">Önünüzde: 0 Kişi Var</p>
            <p id="adminActivityText" style="font-size: 13px; color: #8b949e;">Muhammed Şu An: Boşta (Çağrı Bekliyor)</p>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://mandalina-os-web-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let username = localStorage.getItem('mandalinos_user');

        window.onload = function() {
            if (!username) {
                alert("Önce ana sayfadan giriş yapmalısınız!");
                window.location.href = "../";
                return;
            }
            document.getElementById('userInfoDisplay').innerText = `Hoş geldin, ${username}`;

            // Canlı Yönetici Durumunu Dinle
            db.ref('status/activity').on('value', (snapshot) => {
                const activity = snapshot.val() || "Boşta";
                document.getElementById('adminActivityText').innerText = `Muhammed Şu An: ${activity}`;
            });

            // Canlı Sıra Dinleyici
            db.ref('calls').on('value', (snapshot) => {
                let position = 0;
                let count = 0;
                snapshot.forEach((child) => {
                    count++;
                    if (child.val().user === username) {
                        position = count;
                    }
                });

                if (position > 0) {
                    document.getElementById('queueCard').style.display = 'block';
                    document.getElementById('queuePositionText').innerText = `Sıranız: ${position}. (Önünüzde ${position - 1} kişi var)`;
                } else {
                    document.getElementById('queueCard').style.display = 'none';
                }
            });
        };

        function destekTalebiOlustur() {
            const callRef = db.ref('calls').push();
            callRef.set({
                user: username,
                timestamp: Date.now()
            });
        }
    </script>
</body>
</html>
