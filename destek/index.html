<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mandalina OS - Live Support & Remote Hub</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --accent-color: #ff6f00;
            --accent-cyan: #00f0ff;
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh;
        }
        .container {
            width: 100%; max-width: 540px; background: var(--card-bg);
            border: 1px solid var(--border-color); border-radius: 12px; padding: 20px;
            box-sizing: border-box; text-align: center;
        }
        h1 { color: var(--accent-color); margin-bottom: 5px; font-size: 22px; }
        .queue-card {
            background: #0d1117; border: 1px solid var(--accent-cyan); border-radius: 10px;
            padding: 15px; margin: 15px 0; display: none;
        }
        .chat-container { display: none; margin-top: 15px; text-align: left; }
        .chat-box {
            background: #0d1117; border: 1px solid var(--border-color); border-radius: 8px;
            height: 220px; overflow-y: auto; padding: 10px; margin-bottom: 10px;
        }
        .msg { margin-bottom: 8px; font-size: 13px; word-break: break-all; }
        .msg-user { color: var(--accent-cyan); }
        .msg-admin { color: var(--accent-orange); }
        .msg-img { max-width: 100%; border-radius: 6px; margin-top: 5px; border: 1px solid var(--border-color); }
        .input-row { display: flex; gap: 6px; margin-bottom: 8px; }
        .input-row input[type="text"] { flex: 1; padding: 8px; background: #0d1117; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }
        .btn { padding: 8px 14px; background: var(--accent-color); border: none; color: white; font-weight: bold; border-radius: 6px; cursor: pointer; }
        .btn-cyan { background: var(--accent-cyan); color: #000; border: none; font-weight: bold; padding: 8px 14px; border-radius: 6px; cursor: pointer; }
        .btn-danger { background: #da3633; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 11px; cursor: pointer; }
        
        .repair-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 10px; }
        .btn-repair {
            background: #21262d; border: 1px solid var(--accent-cyan); color: var(--accent-cyan);
            padding: 8px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-repair:hover { background: var(--accent-cyan); color: #000; }
    </style>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body>

    <div class="container">
        <h1>Mandalina OS GLITCH Destek</h1>
        <p style="color:#8b949e; font-size: 13px;">Canlı İletişim & Uzaktan Kontrol Merkezi</p>

        <div id="userInfoDisplay" style="color: var(--accent-cyan); font-weight: bold; margin-bottom: 10px;"></div>

        <button id="requestBtn" class="btn" style="width:100%; padding:12px; margin-bottom:10px;" onclick="sirayiYonet()">📞 Canlı Destek Sırası Al</button>

        <div class="queue-card" id="queueCard">
            <p id="queuePositionText" style="font-size: 16px; font-weight: bold; color: #fff; margin:0;">Sıra Bekleniyor...</p>
            <p id="adminActivityText" style="font-size: 12px; color: #8b949e; margin: 6px 0 0 0;">Destek Durumu: Aktif</p>
            <button class="btn-danger" style="margin-top: 10px; width: 100%; padding: 6px;" onclick="siradanCik()">❌ Sıradan Çık</button>
        </div>

        <div class="chat-container" id="chatContainer">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <span style="color: var(--accent-cyan); font-size: 12px;">🟢 Canlı Görüşme Aktif</span>
                <button class="btn-danger" onclick="sohbetiTemizle()">🗑️ Sohbeti Temizle</button>
            </div>
            
            <div class="chat-box" id="chatBox"></div>

            <div class="input-row">
                <input type="text" id="chatInput" placeholder="Mesajınızı yazın...">
                <input type="file" id="fileInput" accept="image/*" style="display:none;" onchange="resimGonder(this)">
                <button class="btn-cyan" onclick="document.getElementById('fileInput').click()">📷 Görsel</button>
                <button class="btn" onclick="mesajGonder()">Gönder</button>
            </div>

            <button class="btn-cyan" style="width:100%; padding: 10px; margin-top: 5px;" onclick="uzaktanKontrolIstegi()">🖥️ Mandalina OS Uzaktan Kontrol İste</button>

            <div style="margin-top: 15px; border-top: 1px solid var(--border-color); padding-top: 10px; text-align: left;">
                <span style="font-size: 12px; color: var(--accent-orange); font-weight: bold;">🛠️ Hızlı Sistem Onarım Araçları:</span>
                <div class="repair-grid">
                    <button class="btn-repair" onclick="hizliKomutYolla('sudo systemctl enable --now gdm3 && sudo systemctl set-default graphical.target', 'Arayüz GNOME/GDM3 Yapıldı')">🖥️ GNOME/GDM3 Arayüze Geç</button>
                    <button class="btn-repair" onclick="hizliKomutYolla('sudo systemctl restart lightdm || openbox --restart', 'Masaüstü Sıfırlandı')">🔄 Masaüstünü Yeniden Başlat</button>
                    <button class="btn-repair" onclick="hizliKomutYolla('sudo apt update && sudo apt --fix-broken install -y', 'Paket Onarımı Başlatıldı')">📦 Bozuk Paketleri Tamir Et</button>
                    <button class="btn-repair" onclick="hizliKomutYolla('sudo reboot', 'Sistem Yeniden Başlatılıyor')">⚡ Cihazı Yeniden Başlat</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = { databaseURL: "https://mandalina-os-web-default-rtdb.firebaseio.com/" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let username = localStorage.getItem('mandalinos_user');
        let myCallKey = null;
        let inactivityTimer;

        window.onload = function() {
            if (!username) {
                alert("Önce ana sayfadan giriş yapmalısınız!");
                window.location.href = "../";
                return;
            }
            document.getElementById('userInfoDisplay').innerText = `Kullanıcı: ${username}`;

            // 15 Dakika Hareketsizlik veya Sayfadan Çıkışta Sıradan Düşme
            resetInactivityTimer();
            window.onmousemove = resetInactivityTimer;
            window.onkeypress = resetInactivityTimer;
            window.onbeforeunload = function() { siradanCik(); };

            db.ref(`active_sessions/${username}`).on('value', (snapshot) => {
                if (snapshot.exists() && snapshot.val().status === 'accepted') {
                    document.getElementById('queueCard').style.display = 'none';
                    document.getElementById('requestBtn').style.display = 'none';
                    document.getElementById('chatContainer').style.display = 'block';
                } else {
                    document.getElementById('chatContainer').style.display = 'none';
                }
            });

            db.ref('calls').on('value', (snapshot) => {
                let position = 0, count = 0;
                myCallKey = null;
                snapshot.forEach((child) => {
                    count++;
                    if (child.val().user === username) {
                        position = count;
                        myCallKey = child.key;
                    }
                });

                const reqBtn = document.getElementById('requestBtn');
                if (position > 0 && document.getElementById('chatContainer').style.display === 'none') {
                    document.getElementById('queueCard').style.display = 'block';
                    document.getElementById('queuePositionText').innerText = `Sıranız: ${position}. (Önünüzde ${position - 1} kişi var)`;
                    reqBtn.innerText = "⚠️ Sıradasınız (İptal Et)";
                } else if (position === 0 && document.getElementById('chatContainer').style.display === 'none') {
                    document.getElementById('queueCard').style.display = 'none';
                    reqBtn.innerText = "📞 Canlı Destek Sırası Al";
                }
            });

            db.ref(`chats/${username}`).on('value', (snapshot) => {
                const chatBox = document.getElementById('chatBox');
                chatBox.innerHTML = '';
                if (snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        const div = document.createElement('div');
                        div.className = `msg ${data.sender === username ? 'msg-user' : 'msg-admin'}`;
                        if (data.type === 'text') {
                            div.innerText = `${data.sender}: ${data.text}`;
                        } else if (data.type === 'image') {
                            div.innerHTML = `<strong>${data.sender}:</strong><br><img src="${data.image}" class="msg-img">`;
                        }
                        chatBox.appendChild(div);
                    });
                    chatBox.scrollTop = chatBox.scrollHeight;
                }
            });
        };

        function sirayiYonet() {
            if (myCallKey) {
                siradanCik();
            } else {
                // Daha önce listede var mı kontrol et
                db.ref('calls').orderByChild('user').equalTo(username).once('value', (snapshot) => {
                    if (!snapshot.exists()) {
                        db.ref('calls').push().set({ user: username, timestamp: Date.now() });
                    }
                });
            }
        }

        function siradanCik() {
            if (myCallKey) {
                db.ref(`calls/${myCallKey}`).remove();
                myCallKey = null;
            }
        }

        function resetInactivityTimer() {
            clearTimeout(inactivityTimer);
            inactivityTimer = setTimeout(() => {
                siradanCik();
            }, 15 * 60 * 1000); // 15 dakika
        }

        function mesajGonder() {
            const text = document.getElementById('chatInput').value.trim();
            if (!text) return;
            db.ref(`chats/${username}`).push().set({
                sender: username, text: text, type: 'text', timestamp: Date.now()
            });
            document.getElementById('chatInput').value = '';
        }

        function resimGonder(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    db.ref(`chats/${username}`).push().set({
                        sender: username, image: e.target.result, type: 'image', timestamp: Date.now()
                    });
                };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function sohbetiTemizle() {
            if (confirm("Sohbet geçmişini silmek istediğine emin misin?")) {
                db.ref(`chats/${username}`).remove();
            }
        }

        function uzaktanKontrolIstegi() {
            db.ref(`remote_requests/${username}`).set({
                user: username, status: 'requested', timestamp: Date.now()
            }).then(() => alert("Uzaktan kontrol talebiniz iletildi!"));
        }

        function hizliKomutYolla(command, bilgi) {
            db.ref(`remote_commands/${username}`).set({
                type: 'shell',
                command: command,
                timestamp: Date.now()
            }).then(() => alert(`⚡ Komut gönderildi: [${bilgi}]`));
        }
    </script>
</body>
</html>
